unhinged:
  name: "Unhinged"
  register: "Mega-offensive private-group banter between four adult college friends who have explicitly opted into ruthless roasting. Natural Indian English/Hinglish with actual gaali — chutiya, bakchod, gaandu, harami, nalayak, dhakkan, bhosdi ke — dropped where it lands, plus dry contempt, personal digs, absurd escalation and deadpan humiliation. Use current slang only when it sounds natural: aura, mog, cooked, delulu, BFFR, clocked, touch grass, etc. The joke should come from the situation or the person's decision — gaali is seasoning, not the meal, so never stuff it in place of an actual burn. No slurs, no protected-class attacks."
  footer: "Virtual stamps only — no asli paisa, just imaginary daulat and a permanent public record of every chutiyapa decision you have ever made. Zero-sum: winners get exactly what losers lose."
  activityHeading: "Aaj ka lafda"
  activitySoFarHeading: "Ab tak ka damage"
  activityEmpty: "Kuch nahi hua. Chaar log, zero courage. Paanch minute do, koi na koi gaandu kuch na kuch kar hi dega."
  openEmptyTitle: "Kuch open nahi hai. Pathetic."
  openEmptySub: "Har ek ke paas opinion hai, apna naam likhne ki aukaat kisi mein nahi. Call maar, bhosdi ke."
  resolvedEmpty: "Abhi tak kuch resolve nahi hua. Beizzati merely scheduled hai."
  forYouHeading: "Teri agli galti"
  forYouSub: "Jin predictions pe baaki teen already lad rahe hain, aur tu wahan baitha hai zero position ke saath. Ek utha le, gaandu."
  openBetsEmpty: "khaali. Cowardice noted."
  betsEmpty: "Kisi ne call nahi lagaya. Teen paragraph ka gyaan, ek bhi actual position nahi. BFFR."
  poolEmpty: "Pool khaali. Chaar self-declared genius, zero skin in the game."
  leaderboardTitle: "Tum chaaron mein se actually kaun sahi hai?"
  leaderboardSub: "Ranked by return on stamps called over at least {min} resolved predictions. Ek lucky call se kuch prove nahi hota. Record ghatiya hai toh yeh board use likh ke rakhega, permanently."
  leaderboardEmptyTitle: "Abhi tak kisi ne competence ka ek bhi saboot nahi diya."
  calibratingSub: "Not enough verdicts yet. Confident galtiyan karte raho, board apne aap bhar jayega."
  membersTitle: "Chaar chutiye"
  membersSub: "Private table. Sabko sab dikhta hai — teri wins, teri losses, tere ghatiya calls, aur baad mein banaye gaye bahane."
  newTitle: "Aisa claim daal jiska baad mein pachtava ho"
  magicPitch: "Teri wording bohot mehnat kar rahi hai ek bohot bewakoof idea chhupane mein. Machine se tight karwa le, warna baaki teen phaad denge."
  inboxSub: "Naye claims, tere against lagi calls, verdicts, aur rozana ka proof ki tere dost tujhe tujhse behtar jaante hain."
  inboxEmptyTitle: "Shanti hai. Shak hota hai."
  inboxEmptySub: "Kisi ne abhi tak apni beizzati nahi karwayi. Yeh group clearly underperform kar raha hai."
  stakeLimit: "Bas, Nostradamus. Is prediction pe teri limit aa gayi. Isse zyada confidence teri aukaat ke bahar hai."
  voidHint: "Ambiguous ya unresolvable — koi loophole se jeet manufacture nahi karega. Sabke stamps wapas."
  resolveSub: "Tera claim, tera verdict. Final. Na appeal, na rona, na baad mein 'bhai maine woh matlab nahi bola tha'."
  recording: "Record ho gaya. Mubarak ho, ab is ghatiya take pe timestamp bhi hai."
  oops: "Kuch toot gaya. App ki bhi limit hai ki kitni bakwaas jhelega."
  youWon: "Tu jeeta {amount}. Chal theek hai. Ab isko poori zindagi ki personality mat bana lena."
  youLost: "Tu haara {amount}. Poora deserve kiya, harami. Galat tha, aur confidence ke saath galat tha, jo aur bura hai."
  brokeEven: "Barabar. Ek dum average aadmi ka ek dum average performance."
  questionPlaceholder: "Kya yeh nalayak kal 9 baje se pehle gym pahunchega?"
  criteriaPlaceholder: "Submit karne se pehle ek objective YES/NO test aur evidence likh. Na loophole, na emotional appeal, na baad mein 'technically'. Saaf resolve nahi ho sakta toh void kar de."
  commentsHeading: "Bakchodi"
  commentsEmpty: "Ek bhi comment nahi. Saamne itni badi badi baatein, record pe aate hi sannata. Chutiyapa."
  commentPlaceholder: "Seene pe haath rakh ke bol — @name se kisi ko ghaseet le."
  billsTitle: "Apna hissa de, kanjoos"
  billsSub: "Ab asli paisa, imaginary stamps nahi. Jo diya woh likh — split paise tak exact rehta hai, taaki 'bhai next time main karunga' hafta bhar na chale."
  billsEmptyTitle: "Koi bill nahi."
  billsEmptySub: "Kisi ne kuch pay hi nahi kiya. Bade bade aadmi, zinda sirf vibes aur ek dusre ke UPI pe."
  allSquare: "Sab barabar. Kisi pe kisi ka udhaar nahi. Ek durlabh moment of financial izzat."
  talkTitle: "Bol de {language} mein"
  talkSub: "Tap kar, bol, phone ghuma de. Teri bakwaas fluent {language} mein bahar aayegi — honestly tum log kabhi itne padhe-likhe nahi lage."
  phrasebookHeading: "Lines yeh trip bhool nahi sakta"
  startersHeading: "Har trip pe yahi chutiyapa hota hai"
  startersSub: "Ek tap aur record pe. Pehle edit kar le agar tum chaaron ko lagta hai tum special ho. Tum nahi ho."
  tripsTitle: "Kahan jaa rahe ho, nalayak log?"
  tripsSub: "Har trip ka apna table. Ek khol, ya wait kar koi gaandu link bhejta hai. Tumhaare group mein? Good luck."
  tripsEmptyTitle: "Zero trips. Obviously."
  tripsEmptySub: "GOA PLAN SINCE 2017. 'Bhai iss baar nahi ho payega.' BFFR. Woh wali trip khol jo actually hoti hai."
  newTripTitle: "Table khol, dhakkan"
  newTripSub: "Naam de, jagah de, link bhej. Jo pehle kholega woh chupke se 'bhai office' bol ke nahi nikal sakta."
  recapTitle: "Kaun sahi tha aur kaun sirf loud tha"
  recapSub: "Poori trip ek page pe — board, dushmaniyan, aur woh ek call jo baaki teen tujhe marte dam tak yaad dilayenge."
  recapEmptyTitle: "Abhi kuch settle nahi hua."
  recapEmptySub: "Recap ko verdict chahiye, bakchod. Kuch resolve kar, phir aa ke beizzati dekh."
  sealedNote: "Yeh trip sirf un phones pe hai jinhone join kiya. Aur koi nahi padh sakta — hum bhi nahi. Teri beizzati fully private hai."
  sealedTripName: "A trip. Sealed. Deal with it."
  keylessTitle: "Seat hai, chaabi nahi. Classic."
  keylessSub: "Doosre phone pe app khol aur isko chaabi bhej, ya trip pe kisi bhi bakchod se maang le. Koi toh tarass khaayega."
  noKeyYet: "{name} ko abhi tak chaabi nahi mili. Bechara."
  cardPublishNote: "Yeh verdict ko public page pe daal dega — bas first names aur stamps. Baaki ghatiya calls sealed rehte hain, don't worry."
