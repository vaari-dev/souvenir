# Every flavored string, keyed by lingo. "english" is the default and the reference: every
# other lingo must define exactly its fields. `pnpm lingo:gen` compiles this to
# lib/lingo.data.ts.
#
# Placeholders are substituted at render time:
#   leaderboardSub  {min}     minimum resolved predictions to be ranked
#   youWon/youLost  {amount}  the formatted amount, e.g. "12 stamps"
#
# Buttons, nav, and rule errors stay plain; personality lives in headings, empty states, asides,
# result lines, and placeholders.
english:
  name: "Plain English"
  register: "plain English"
  footer: "Virtual stamps only. Zero-sum: winners split exactly what losers put in. Every outcome is on the record."
  activityHeading: "Recent action"
  activitySoFarHeading: "Action so far"
  activityEmpty: "Nothing yet. Quiet before the action."
  openEmptyTitle: "No open predictions."
  openEmptySub: "Someone has to put a stake in the ground first. Apparently it won't be you."
  resolvedEmpty: "Nothing resolved yet. History starts with the first verdict."
  forYouHeading: "Picked for you"
  forYouSub: "Open predictions you haven't joined — where the action, the stamps, and your friends already are."
  openBetsEmpty: "nothing yet"
  betsEmpty: "Nobody has called it yet. Plenty of opinions, apparently."
  poolEmpty: "no positions yet"
  leaderboardTitle: "Who can actually predict things"
  leaderboardSub: "Ranked by return on stamps put up, over at least {min} resolved predictions. One lucky call is noise; a track record is evidence."
  leaderboardEmptyTitle: "The board is empty."
  calibratingSub: "Not enough resolved predictions to rank yet."
  membersTitle: "The group"
  membersSub: "One private table. Everyone sees everything."
  newTitle: "Put a claim on the record"
  magicPitch: "It'll tighten the wording and close the loopholes before your friends get a chance to exploit them."
  inboxSub: "New predictions, calls on the ones you're in, and verdicts when they resolve."
  inboxEmptyTitle: "All quiet."
  inboxEmptySub: "When friends open predictions or call against you, it shows up here."
  stakeLimit: "You've hit the stake limit on this prediction."
  voidHint: "Ambiguous or unresolvable — everyone gets their stamps back."
  resolveSub: "You created this prediction, so you resolve it. Resolution is final."
  recording: "Recording…"
  oops: "That didn't work."
  youWon: "You won {amount}."
  youLost: "You lost {amount}."
  brokeEven: "You broke even."
  questionPlaceholder: "Will it rain before 6 PM tomorrow?"
  criteriaPlaceholder: "I'll check at 6:00 PM sharp — a wet road counts as rain, photo as evidence. Rain resolves YES; dry resolves NO. If I can't check, I'll void it."
  commentsHeading: "Table talk"
  commentsEmpty: "No comments yet. Say the quiet part out loud."
  commentPlaceholder: "Add a comment — @name pulls a friend in."
  billsTitle: "Who owes whom"
  billsSub: "Real money this time. Add what you paid; the split stays exact to the paisa — and the satang."
  billsEmptyTitle: "No bills yet."
  billsEmptySub: "The first shared dinner, cab, or bad decision lands here."
  allSquare: "All square. Nobody owes anybody anything."
  talkTitle: "Say it in {language}"
  talkSub: "Tap your side, speak, then hand the phone over. It says the rest out loud."
  phrasebookHeading: "Phrases the trip kept"
  startersHeading: "Every trip argues about these"
  startersSub: "Tap one to put it on the record. Edit it first if your group is special."
  tripsTitle: "Where are we going?"
  tripsSub: "One table per trip. Open one, or wait for somebody braver to send you a link."
  tripsEmptyTitle: "No trips yet."
  tripsEmptySub: "Every group chat has a trip that never happens. Start the one that does."
  newTripTitle: "Open the table"
  newTripSub: "Name it, point it somewhere, and the first link you share is the first person who can't back out quietly."
  recapTitle: "Who saw it coming"
  recapSub: "The whole season on one page: the table, the rivalries, the swing nobody will let go of."
  recapEmptyTitle: "Nothing settled yet."
  recapEmptySub: "A recap needs verdicts. Resolve something and come back."
  sealedNote: "This trip lives on the phones that joined it. Nobody else can read it — not even us."
  sealedTripName: "A sealed trip"
  keylessTitle: "You've got a seat, not the key."
  keylessSub: "Open the app on your other phone and send this one the key, or ask anyone on the trip to send it."
  noKeyYet: "{name} hasn't got the key yet."
  cardPublishNote: "This puts the verdict on a public page: first names and stamps. Everything else stays sealed."

