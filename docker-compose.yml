# One compose file for dev and prod.
#
#   Dev:   docker compose up -d db        (then `pnpm dev`)
#          docker compose up -d --build   (full stack, built locally)
#   Prod:  export APP_IMAGE=...   (GHCR tag; CI does this)
#          docker compose pull app && docker compose up -d --no-build app
#
# Knobs come from .env (see .env.example).

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: souvenir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-souvenir}
      POSTGRES_DB: souvenir
    volumes:
      - pgdata:/var/lib/postgresql
    # Loopback only; never expose Postgres.
    ports:
      - "127.0.0.1:${DB_PORT:-5566}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U souvenir -d souvenir"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Runs pending migrations and exits; the app starts only after it succeeds.
  migrate:
    image: ${APP_IMAGE:-souvenir:local}
    build:
      context: .
    command: ["node", "scripts/migrate.ts"]
    # lib/env.ts validates the whole environment on import, so migrate needs the real .env.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://souvenir:${POSTGRES_PASSWORD:-souvenir}@db:5432/souvenir
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    image: ${APP_IMAGE:-souvenir:local}
    build:
      context: .
    restart: unless-stopped
    # Loopback assumes a reverse proxy terminates TLS; APP_BIND=0.0.0.0 exposes directly.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    # Required: AUTH_SECRET has no default, so a missing .env fails fast.
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://souvenir:${POSTGRES_PASSWORD:-souvenir}@db:5432/souvenir
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The proxy reaches the app over this shared network without a public port. Every project
    # calls its service `app`, so the proxy targets the unique alias: souvenir:3000.
    networks:
      default: null
      edge:
        aliases:
          - souvenir

volumes:
  pgdata:

networks:
  # Must already exist (the proxy lives there); locally, `docker network create edge` once.
  edge:
    external: true
    name: ${DOCKER_NETWORK:-edge}
