# Not read by Dependabot, so bumped by hand: packageManager (with the Dockerfile's pnpm) and the
# workflows' node-version (with the Dockerfile's Node).

version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
    ignore:
      # A major needs pg_upgrade on the data volume.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
