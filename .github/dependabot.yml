# npm and actions only. Images are not here: they float on a major and a variant (Dockerfile,
# docker-compose.yml), and the weekly scheduled run in ci.yml rebuilds and redeploys on them.
# Bumped by hand: packageManager (with the Dockerfile's pnpm), and any major — Node's in the
# Dockerfile and the workflows' node-version, Postgres's by runbook.

version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
